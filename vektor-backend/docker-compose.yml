services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: vektor
      POSTGRES_PASSWORD: vektor
      POSTGRES_DB: vektor
    ports:
      - "5432:5432"
    volumes:
      - vektor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vektor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Хост-порт 6380, а не 6379: 6379 на этой машине держит контейнер
    # redis_cache соседнего проекта. Внутри контейнера порт штатный.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vektor_pg:
